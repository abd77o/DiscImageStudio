name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-binary:
    name: build and publish x86 binary
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Dear ImGui + stb_image
        shell: cmd
        run: scripts\fetch_deps.bat

      - name: Configure (x86, static CRT)
        run: cmake -S . -B build -A Win32 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Tests (mock drive)
        shell: cmd
        run: |
          build\Release\test_burn_logic.exe
          build\Release\test_gui_logic.exe

      - name: Stage the release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-manual}"
          exe="build/Release/DiscImageStudio.exe"
          ls -l "$exe"
          mkdir -p dist
          cp "$exe" "dist/DiscImageStudio-${tag}-win32.exe"
          cp README.md LICENSE docs/HARDWARE_NOTES.md dist/
          ( cd dist && sha256sum "DiscImageStudio-${tag}-win32.exe" > "DiscImageStudio-${tag}-win32.exe.sha256" )
          echo "--- staged ---"
          ls -l dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscImageStudio-${{ github.ref_name }}-win32
          path: dist/
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: 7Disc Image Studio ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          body: |
            **Experimental software.** It writes raw sectors to a CD-R and permanently destroys the disc.
            Read `HARDWARE_NOTES.md` (included below) before burning, and start with a CD-RW.

            * Single 32-bit static executable — runs on Windows 7 x86/x64, no runtime dependencies
            * Burn path validated against a mock drive in CI; real-hardware reports are very welcome
            * Verify the download with the `.sha256` file:

              ```bash
              sha256sum -c DiscImageStudio-${{ github.ref_name }}-win32.exe.sha256
              ```
          files: dist/*
