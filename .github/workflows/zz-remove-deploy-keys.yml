name: Remove deploy keys
on:
  push:
    paths:
      - .github/workflows/zz-remove-deploy-keys.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every deploy key, then remove this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          repo="${{ github.repository }}"
          api="https://api.github.com/repos/$repo"
          keys=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/keys")
          echo "keys: $keys"
          ids=$(printf '%s' "$keys" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(" ".join(str(k["id"]) for k in d)) if isinstance(d,list) else print("")')
          echo "ids to delete: [$ids]"
          if [ -z "$ids" ]; then echo "no deploy keys present"; fi
          for id in $ids; do
            code=$(curl -sS -o /tmp/out -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/keys/$id")
            echo "DELETE key $id -> HTTP $code $(cat /tmp/out)"
          done
          remaining=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/keys")
          echo "remaining: $remaining"
          if [ "$remaining" != "[]" ]; then echo "::error::deploy keys still present"; exit 1; fi
          # self-remove this workflow file
          sha=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/contents/.github/workflows/zz-remove-deploy-keys.yml?ref=main" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("sha",""))')
          curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -d "{\"message\":\"ci: drop the one-off deploy-key removal workflow\",\"sha\":\"$sha\",\"branch\":\"main\"}" \
            "$api/contents/.github/workflows/zz-remove-deploy-keys.yml" | head -c 300
          echo
