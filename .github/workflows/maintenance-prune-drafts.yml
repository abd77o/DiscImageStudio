name: Maintenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune-draft-releases:
    name: delete stale draft releases
    runs-on: ubuntu-latest
    steps:
      - name: Delete every draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          drafts=$(gh release list --repo "$REPO" --limit 100 --json tagName,isDraft \
                   --jq '.[] | select(.isDraft) | .tagName')
          if [ -z "$drafts" ]; then
            echo "no draft releases — nothing to prune"
          else
            for tag in $drafts; do
              echo "deleting draft release for tag: $tag"
              gh release delete "$tag" --repo "$REPO" --yes
            done
          fi
          left=$(gh release list --repo "$REPO" --limit 100 --json isDraft \
                 --jq '[.[] | select(.isDraft)] | length')
          echo "drafts remaining: $left"
          test "$left" -eq 0
